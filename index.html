<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gabrielle Essence - Product Card</title>
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <style>
        :root {
            --dark-cyan: hsl(158, 36%, 37%);
            --very-dark-cyan: hsl(158, 36%, 20%);
            --cream: hsl(30, 38%, 92%);
            --very-dark-blue: hsl(212, 21%, 14%);
            --dark-grayish-blue: hsl(228, 12%, 48%);
            --white: hsl(0, 0%, 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-size: 14px;
            font-family: Arial, Helvetica, sans-serif;
            background-color: var(--cream);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .product-card {
            background-color: var(--white);
            display: flex;
            flex-direction: column;
            border-radius: 10px;
            overflow: hidden;
            max-width: 343px;
            width: 100%;
        }

        .product-image {
            width: 100%;
            display: block;
        }

        .product-image img {
            width: 100%;
            height: auto;
            display: block;
        }

        .product-content {
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .category {
            letter-spacing: 5px;
            color: var(--dark-grayish-blue);
            font-size: 0.8rem;
            margin-bottom: 12px;
        }

        .title {
            font-family: Georgia, 'Times New Roman', Times, serif;
            color: var(--very-dark-blue);
            font-size: 2rem;
            line-height: 1;
            margin-bottom: 15px;
        }

        .description {
            color: var(--dark-grayish-blue);
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .price-container {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .current-price {
            font-family: Georgia, 'Times New Roman', Times, serif;
            color: var(--dark-cyan);
            font-size: 2rem;
            font-weight: bold;
        }

        .old-price {
            color: var(--dark-grayish-blue);
            text-decoration: line-through;
        }

        .add-btn {
            width: 100%;
            background-color: var(--dark-cyan);
            color: var(--white);
            border: none;
            padding: 15px;
            border-radius: 8px;
            font-weight: 700;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .add-btn:hover {
            background-color: hsl(158, 36%, 15%); /* To jest ten głęboki zielony widoczny na Twoim zdjęciu active-states */
        }

        @media (min-width: 600px) {
            .product-card {
                max-width: 600px;
                flex-direction: row;
            }

            .product-image {
                width: 50%;
            }

            .product-image img {
                height: 100%;
                object-fit: cover;
            }

            .product-content {
                width: 50%;
                padding: 32px;
            }
        }
    </style>
</head>
<body>

    <main class="product-card">
        <picture class="product-image">
            <source media="(min-width: 600px)" srcset="image-product-desktop.jpg">
            <img src="image-product-mobile.jpg" alt="Gabrielle Essence Eau De Parfum">
        </picture>
        
        <div class="product-content">
            <p class="category">P E R F U M E</p>
            
            <h1 class="title">Gabrielle Essence Eau De Parfum</h1>
            
            <p class="description">
                A floral, solar and voluptuous interpretation composed by Olivier Polge, Perfumer-Creator for the House of CHANEL.
            </p>
            
            <div class="price-container">
                <span class="current-price">$149.99</span>
                <span class="old-price">$169.99</span>
            </div>
            
            <button class="add-btn">
                <img src="icon-cart.svg" alt="" aria-hidden="true">
                Add to Cart
            </button>
        </div>
    </main>

</body>
</html>
